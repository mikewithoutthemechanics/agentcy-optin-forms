name: Agentcy Daily Follow-Up Automation

on:
  schedule:
    # Runs daily at 07:00 UTC = 09:00 SAST
    - cron: '0 7 * * *'
  workflow_dispatch:  # Manual trigger for testing

permissions:
  contents: read

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: app0CK3JUNYEGcCMV
      AIRTABLE_TABLE_ID: tblnhzmqneNswTvGd
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      FROM_EMAIL: michael@agentcy.co.za

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests python-dotenv --quiet

      - name: Run follow-up automation
        run: |
          python scripts/daily_followup.py

      - name: Log completion
        run: echo "Follow-up automation completed at $(date)"